name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check, test, build, browser test
    # A fixed image rather than ubuntu-latest: the latest label moves to a new Ubuntu on its own schedule.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Orbit tests
        run: npm test

      - name: Build
        run: npm run build

      # The runner image ships Google Chrome; with no GPU the scene renders through SwiftShader
      # (tools/chrome.cjs). The test opens the built file itself, the same one people download.
      - name: Browser test
        run: node tests/observatory.cjs "file://$PWD/dist/index.html"

      # The build is a single self-contained HTML file: downloadable from the run page and opens from disk.
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: aetherium
          path: dist/index.html
          if-no-files-found: error
          retention-days: 14
